<title>SmartPay NG — Redesign & Heuristic Evaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE9F4; --panel:#FFFFFF; --panel-2:#F6F4FB; --ink:#1A1433; --ink-2:#5B5675; --ink-3:#9893AE;
  --line:#E6E2F1; --brand:#3B1D8F; --brand-2:#6D28D9; --brand-soft:#EFE9FC; --brand-tint:#F7F4FE;
  --naira:#0E9F6E; --naira-soft:#E3F7EF; --amber:#D97706; --amber-soft:#FEF3DC; --red:#D92D20; --red-soft:#FEE9E7;
  --radius-lg:24px; --radius-md:16px; --radius-sm:10px; --shadow:0 12px 40px rgba(59,29,143,.10);
  --font:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141024; } }
:root[data-theme="dark"]{ --bg:#141024; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #A78BFA;outline-offset:2px}
input{font:inherit;color:inherit}
.fnum{font-variant-numeric:tabular-nums lining-nums}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- Stage ---------- */
.stage{height:100dvh;display:grid;grid-template-columns:400px 1fr;gap:0}
.audit{background:#1A1433;color:#EDE9F7;overflow:auto;padding:28px 26px 40px;position:relative}
.stage-phone{display:grid;place-items:center;padding:24px;position:relative}
.phone{width:390px;height:844px;max-height:calc(100dvh - 48px);background:#fff;border-radius:48px;position:relative;overflow:hidden;box-shadow:0 40px 90px rgba(20,16,36,.35),0 0 0 10px #1A1433,0 0 0 12px #3a3352;}
.phone .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#0F0C1B;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 0;font-size:14px;font-weight:700;z-index:55;pointer-events:none;color:var(--ink)}
.statusbar.light{color:#fff}
.statusbar .right{display:flex;gap:6px;align-items:center;font-size:12px}
.statusbar .net{padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.08);font-weight:700;font-size:11px}
.statusbar.light .net{background:rgba(255,255,255,.22)}
#app{position:absolute;inset:0;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden;animation:enter .32s cubic-bezier(.2,.8,.2,1) both}
.screen.back{animation:enterBack .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes enterBack{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.has-nav{padding-bottom:110px}
.topbar{display:flex;align-items:center;gap:8px;padding:66px 14px 10px;min-height:112px}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.01em;flex:1;text-align:center}
.topbar .spacer{width:44px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);transition:transform .15s,background .15s}
.iconbtn:active{transform:scale(.9);background:var(--panel-2)}
.iconbtn svg{width:22px;height:22px}

/* ---------- Type ---------- */
h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h3{font-size:16px;font-weight:700}
.sub{color:var(--ink-2);font-size:14px;line-height:1.5}
.small{font-size:12px;color:var(--ink-3)}
.label{font-size:13px;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.section-h h3{font-size:15px}
.section-h a,.link{color:var(--brand-2);font-weight:700;font-size:13px;text-decoration:none;cursor:pointer}

/* ---------- Buttons ---------- */
.btn{width:100%;height:56px;border-radius:18px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s,background .2s,opacity .2s;position:relative;overflow:hidden}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--brand-2);color:#fff;box-shadow:0 10px 24px rgba(109,40,217,.28)}
.btn.primary:disabled{background:#DDD6F3;color:#fff;box-shadow:none;cursor:not-allowed}
.btn.secondary{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand-2);height:48px}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.amber{background:var(--amber);color:#fff}
.btn.pulse::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.25);animation:pulseX 1s infinite}
@keyframes pulseX{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.sticky-cta{padding:12px 20px 34px;background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));position:relative}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}

/* ---------- Fields ---------- */
.field{position:relative;background:var(--panel-2);border:1.5px solid transparent;border-radius:16px;height:58px;display:flex;align-items:center;padding:0 16px;gap:10px;transition:border-color .2s,background .2s,box-shadow .2s}
.field:focus-within{border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 4px rgba(109,40,217,.12)}
.field.error{border-color:var(--red);background:#fff;animation:shake .35s}
.field.ok{border-color:var(--naira)}
.field input{flex:1;border:0;background:transparent;outline:0;font-size:17px;font-weight:600;min-width:0;height:100%}
.field input::placeholder{color:var(--ink-3);font-weight:500}
.field .prefix{font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.field .flag{width:22px;height:16px;border-radius:3px;background:linear-gradient(90deg,#008751 33%,#fff 33% 66%,#008751 66%);display:inline-block}
.help{font-size:12px;color:var(--ink-3);margin-top:8px;min-height:16px;display:flex;align-items:center;gap:6px}
.help.error{color:var(--red)} .help.ok{color:var(--naira)}
.carrier{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:#FFE600;color:#1A1433;transition:opacity .2s}
.carrier.airtel{background:#ED1C24;color:#fff}.carrier.glo{background:#00A651;color:#fff}.carrier.nine{background:#006F3C;color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* OTP */
.otp{display:flex;gap:10px;justify-content:center;margin:26px 0 10px}
.otp .box{width:48px;height:58px;border-radius:14px;background:var(--panel-2);border:1.5px solid transparent;display:grid;place-items:center;font-size:24px;font-weight:800;transition:all .18s}
.otp .box.active{border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 4px rgba(109,40,217,.12)}
.otp .box.filled{animation:pop .22s cubic-bezier(.2,1.6,.4,1)}
.otp .box.done{background:var(--naira-soft);border-color:var(--naira);color:var(--naira)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.otp-hidden{position:absolute;opacity:0;pointer-events:none}

/* Progress steps */
.steps{display:flex;gap:6px;margin:6px 0 22px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.steps i::after{content:"";position:absolute;inset:0;background:var(--brand-2);transform:translateX(-100%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.steps i.on::after{transform:none}

/* ---------- Home ---------- */
.hero{background:linear-gradient(160deg,#2A1470 0%,#3B1D8F 45%,#5B2BC7 100%);color:#fff;padding:64px 20px 26px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);top:-140px;right:-90px}
.hero .row{display:flex;align-items:center;justify-content:space-between;position:relative}
.avatar{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:17px}
.hero .greet{display:flex;align-items:center;gap:12px}
.hero .greet .name{font-weight:700;font-size:16px}.hero .greet .time{font-size:12px;opacity:.75}
.bal-label{margin-top:26px;font-size:13px;opacity:.8;display:flex;align-items:center;gap:8px}
.bal{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px;display:flex;align-items:baseline;gap:6px}
.bal .kobo{font-size:20px;opacity:.7;font-weight:700}
.bal .naira{font-size:26px;font-weight:600;opacity:.85}
.bal.hidden .digits{filter:blur(0);letter-spacing:.1em}
.eye{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.eye svg{width:18px;height:18px}
.vacct{margin-top:18px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(8px)}
.vacct .n{font-weight:800;letter-spacing:.06em;font-size:15px}
.vacct .b{font-size:11px;opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;transition:background .2s}
.chip.copied{background:var(--naira)}
.netpill{position:relative;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.16)}
.netpill .dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:beacon 2s infinite}
.netpill.poor .dot{background:#FBBF24;box-shadow:0 0 0 0 rgba(251,191,36,.7)}
@keyframes beacon{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-26px;padding:0 20px;position:relative;z-index:2}
.act{background:#fff;border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(59,29,143,.10);transition:transform .15s}
.act:active{transform:scale(.94)}
.act .ic{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center}
.act .ic svg{width:22px;height:22px}
.act span{font-size:12px;font-weight:700}
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.svc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;border-radius:14px;transition:background .15s}
.svc:active{background:var(--panel-2)}
.svc .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:20px;background:var(--panel-2)}
.svc span{font-size:12px;font-weight:600;color:var(--ink-2)}

/* Transactions */
.tx{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .15s;border-radius:12px}
.tx:active{background:var(--panel-2)}
.tx:last-child{border-bottom:0}
.tx .av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0}
.tx .av.in{background:var(--naira-soft);color:var(--naira)}.tx .av.out{background:var(--brand-soft);color:var(--brand)}.tx .av.fail{background:var(--red-soft);color:var(--red)}.tx .av.pend{background:var(--amber-soft);color:var(--amber)}
.tx .meta{flex:1;min-width:0}
.tx .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;align-items:center}
.tx .amt{font-weight:800;font-size:15px;text-align:right}
.tx .amt.in{color:var(--naira)}
.tx .amt .st{display:block;font-size:11px;font-weight:600;color:var(--ink-3);margin-top:2px}
.status{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.status.ok{background:var(--naira-soft);color:var(--naira)}.status.pend{background:var(--amber-soft);color:var(--amber)}.status.fail{background:var(--red-soft);color:var(--red)}
.day{font-size:12px;font-weight:700;color:var(--ink-3);margin:18px 0 4px}
.empty{text-align:center;padding:40px 20px}
.empty .ill{width:96px;height:96px;margin:0 auto 16px;border-radius:32px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-2)}
.empty h3{margin-bottom:6px}

/* ---------- Bottom nav ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;height:92px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 22px;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink-3);position:relative;transition:color .2s}
.nav button svg{width:24px;height:24px;transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.nav button.on{color:var(--brand-2)}
.nav button.on svg{transform:translateY(-2px)}
.nav button.on::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:3px;background:var(--brand-2);animation:grow .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes grow{from{width:0}to{width:28px}}
.nav .scanb{position:relative}
.nav .scanb .orb{width:58px;height:58px;border-radius:20px;background:var(--brand-2);color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 12px 26px rgba(109,40,217,.4);transition:transform .2s}
.nav .scanb:active .orb{transform:scale(.92)}
.nav .scanb .orb svg{width:26px;height:26px;transform:none!important}

/* ---------- Scan ---------- */
.cam{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#3a3a48,#141418 70%);overflow:hidden}
.cam .grain{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);opacity:.6}
.cam .tile{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.04) 41%,transparent 42%),linear-gradient(200deg,transparent 60%,rgba(255,255,255,.05) 61%,transparent 62%)}
.viewfinder{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:250px;height:250px}
.viewfinder .c{position:absolute;width:38px;height:38px;border:4px solid #fff;border-radius:6px}
.viewfinder .c.tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:20px}
.viewfinder .c.tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:20px}
.viewfinder .c.bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:20px}
.viewfinder .c.br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:20px}
.viewfinder .laser{position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,#C4B5FD,#fff,#C4B5FD,transparent);box-shadow:0 0 14px #A78BFA;animation:laser 2.2s ease-in-out infinite}
@keyframes laser{0%,100%{top:14px}50%{top:calc(100% - 14px)}}
.viewfinder.found .c{border-color:#4ADE80;animation:lock .4s cubic-bezier(.2,1.6,.4,1)}
.viewfinder.found .laser{display:none}
@keyframes lock{0%{transform:scale(1.15)}100%{transform:scale(1)}}
.scan-mask{position:absolute;inset:0;background:rgba(10,8,18,.55);mask:radial-gradient(transparent 0,transparent 0),linear-gradient(#000 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude}
.scan-ui{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff}
.scan-ui .tip{text-align:center;margin-top:auto;font-size:14px;opacity:.85;padding:0 30px}
.scan-tools{display:flex;justify-content:center;gap:14px;margin:22px 0 120px}
.tool{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.tool .k{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.14);display:grid;place-items:center;transition:background .2s,transform .15s}
.tool:active .k{transform:scale(.92)}
.tool.on .k{background:#fff;color:var(--brand)}
.segment{display:inline-flex;background:rgba(255,255,255,.14);border-radius:14px;padding:4px;margin:0 auto;position:relative}
.segment button{padding:8px 18px;border-radius:11px;font-size:13px;font-weight:700;color:#fff;position:relative;z-index:1;transition:color .2s}
.segment button.on{color:var(--brand)}
.segment .thumb{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);left:4px;background:#fff;border-radius:11px;transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
.segment.r .thumb{transform:translateX(100%)}
.qr-card{background:#fff;color:var(--ink);border-radius:28px;padding:22px;width:290px;margin:0 auto;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.qr{width:200px;height:200px;margin:10px auto;display:grid;grid-template-columns:repeat(21,1fr);gap:1px;background:#fff;padding:6px;border-radius:14px}
.qr i{background:var(--ink);border-radius:1px}
.qr i.o{background:transparent}

/* ---------- Send / Amount ---------- */
.rcpt{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:18px;padding:12px 14px}
.rcpt .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.rcpt .who{flex:1;min-width:0}.rcpt .who b{display:block;font-size:15px}.rcpt .who span{font-size:12px;color:var(--ink-3)}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--naira);font-size:11px;font-weight:700}
.amount-wrap{text-align:center;padding:26px 0 6px}
.amount{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;display:inline-flex;align-items:baseline;gap:4px;min-height:60px}
.amount .cur{font-size:30px;font-weight:600;color:var(--ink-3)}
.amount .v{transition:color .2s}
.amount .v.zero{color:var(--ink-3)}
.amount .d{display:inline-block;animation:digit .18s cubic-bezier(.2,1.6,.4,1)}
@keyframes digit{from{transform:translateY(10px) scale(.8);opacity:0}}
.amount.over .v{color:var(--red)}
.avail{font-size:13px;color:var(--ink-2);margin-top:10px}
.avail b{color:var(--ink)}
.quick{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.quick button{padding:8px 14px;border-radius:12px;background:var(--panel-2);font-weight:700;font-size:13px;transition:all .15s}
.quick button:active{transform:scale(.94)}.quick button.on{background:var(--brand-soft);color:var(--brand-2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px 0}
.keypad button{height:62px;border-radius:18px;font-size:26px;font-weight:600;display:grid;place-items:center;transition:background .12s,transform .1s}
.keypad button:active{background:var(--panel-2);transform:scale(.94)}
.keypad button svg{width:26px;height:26px}
.note{margin:6px 20px 0}
.contacts{display:flex;gap:14px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.contacts::-webkit-scrollbar{display:none}
.ct{display:flex;flex-direction:column;align-items:center;gap:8px;width:64px;flex-shrink:0;transition:transform .15s}
.ct:active{transform:scale(.92)}
.ct .av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;border:2.5px solid transparent;transition:border-color .2s}
.ct.on .av{border-color:var(--brand-2);box-shadow:0 0 0 3px #fff inset}
.ct span{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.ct.add .av{background:var(--brand-soft);color:var(--brand-2);border:1.5px dashed var(--brand-2)}
.tabs{display:flex;background:var(--panel-2);border-radius:14px;padding:4px;position:relative;margin-top:8px}
.tabs button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13px;color:var(--ink-2);z-index:1;transition:color .2s}
.tabs button.on{color:var(--brand)}
.tabs .thumb{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);left:4px;background:#fff;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .28s cubic-bezier(.2,.9,.3,1.1)}
.tabs.r .thumb{transform:translateX(100%)}
.bankpick{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:16px;height:58px;padding:0 16px;width:100%;text-align:left;font-weight:600;font-size:16px}
.bankpick .logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.banklist button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;font-weight:600;font-size:15px}
.banklist button:last-child{border-bottom:0}
.banklist .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.banklist small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.resolve{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-top:10px;min-height:20px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--brand-2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Review */
.review{background:var(--panel-2);border-radius:20px;padding:6px 16px;margin-top:16px}
.review .r{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.review .r:last-child{border-bottom:0}
.review .r span{color:var(--ink-2)}.review .r b{font-weight:700;text-align:right}
.review .r b.free{color:var(--naira)}
.slider{position:relative;height:60px;border-radius:30px;background:var(--brand-soft);overflow:hidden;user-select:none;touch-action:pan-y}
.slider .track{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--brand);font-size:15px;padding-left:40px;transition:opacity .2s}
.slider .knob{position:absolute;top:4px;left:4px;width:52px;height:52px;border-radius:50%;background:var(--brand-2);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(109,40,217,.35);transition:left .05s;cursor:grab}
.slider .knob svg{width:22px;height:22px}
.slider .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--brand-2);opacity:.15;border-radius:30px}
.slider.done{background:var(--naira-soft)}.slider.done .knob{background:var(--naira);left:calc(100% - 56px)!important}
.slider.done .track{color:var(--naira)}

/* PIN */
.pin-dots{display:flex;gap:18px;justify-content:center;margin:26px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:all .18s}
.pin-dots i.on{background:var(--brand-2);transform:scale(1.15)}
.pin-dots.err i{background:var(--red);animation:shake .35s}
.pin-dots.ok i{background:var(--naira)}
.bio{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--brand-2);font-weight:700;font-size:14px;margin:6px 0 10px}
.bio svg{width:22px;height:22px}

/* Processing / Success */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.proc{width:120px;height:120px;position:relative;margin-bottom:24px}
.proc .ring{position:absolute;inset:0;border-radius:50%;border:5px solid var(--brand-soft);border-top-color:var(--brand-2);animation:spin 1s linear infinite}
.proc .ring.two{inset:16px;border-color:var(--brand-soft);border-bottom-color:#A78BFA;animation-duration:1.6s;animation-direction:reverse}
.proc .naira{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--brand)}
.stagelist{margin-top:22px;text-align:left;width:100%;max-width:260px}
.stagelist div{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);padding:6px 0;transition:color .3s}
.stagelist div i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:all .3s}
.stagelist div.on{color:var(--ink)}.stagelist div.on i{border-color:var(--brand-2);border-top-color:transparent;animation:spin .8s linear infinite}
.stagelist div.done{color:var(--ink-2)}.stagelist div.done i{background:var(--naira);border-color:var(--naira);animation:none}
.stagelist div.done i::after{content:"";width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) translate(-1px,-1px)}
.success-wrap{background:linear-gradient(180deg,#0E9F6E 0%,#0B8A5F 100%);color:#fff;flex:1;display:flex;flex-direction:column;align-items:center;padding:100px 24px 30px;position:relative;overflow:hidden}
.check{width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.check svg{width:60px;height:60px}
.check svg path{stroke:var(--naira);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .25s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.check::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.5);animation:ringout 1s .2s ease-out forwards}
@keyframes ringout{to{transform:scale(1.5);opacity:0}}
.confetti i{position:absolute;width:8px;height:8px;border-radius:2px;top:40%;left:50%;animation:conf 1.1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.success-wrap h2{margin-top:26px;font-size:24px}
.success-wrap .big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.receipt{background:#fff;color:var(--ink);border-radius:24px;padding:18px 18px 14px;width:100%;margin-top:26px;position:relative}
.receipt::before,.receipt::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#0C905F;top:-11px}
.receipt::before{left:-11px}.receipt::after{right:-11px}
.receipt .r{display:flex;justify-content:space-between;padding:9px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.receipt .r:last-child{border-bottom:0}
.receipt .r span{color:var(--ink-2)}.receipt .r b{font-weight:700}
.rowbtns{display:flex;gap:10px;margin-top:auto;width:100%;padding-top:18px}
.rowbtns .btn{height:52px;font-size:15px}
.rowbtns .btn.w{background:rgba(255,255,255,.18);color:#fff}
.rowbtns .btn.wf{background:#fff;color:var(--naira)}
.sound{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;background:rgba(255,255,255,.16);padding:8px 14px;border-radius:12px}
.sound .bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.sound .bars i{width:3px;background:#fff;border-radius:2px;animation:bar .9s infinite ease-in-out}
.sound .bars i:nth-child(2){animation-delay:.15s}.sound .bars i:nth-child(3){animation-delay:.3s}.sound .bars i:nth-child(4){animation-delay:.45s}
@keyframes bar{0%,100%{height:4px}50%{height:14px}}

/* ---------- Sheets / toasts ---------- */
.sheet-bg{position:absolute;inset:0;background:rgba(20,16,36,.45);z-index:80;animation:fade .25s both;display:flex;align-items:flex-end}
.sheet-bg.closing{animation:fadeout .22s both}
.sheet-bg.closing .sheet{animation:sheetdown .22s both}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
.sheet{width:100%;background:#fff;border-radius:30px 30px 0 0;padding:10px 20px 36px;animation:sheetup .32s cubic-bezier(.2,.9,.3,1) both;max-height:88%;overflow:auto}
@keyframes sheetup{from{transform:translateY(100%)}}@keyframes sheetdown{to{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:6px}
.toast{position:absolute;left:20px;right:20px;top:70px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:600;z-index:90;display:flex;align-items:center;gap:10px;animation:toastin .3s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.toast.out{animation:toastout .25s both}
.toast.ok{background:var(--naira)}.toast.warn{background:var(--amber)}
@keyframes toastin{from{transform:translateY(-20px);opacity:0}}@keyframes toastout{to{transform:translateY(-20px);opacity:0}}
.network-sheet .icon{width:64px;height:64px;border-radius:20px;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;margin-bottom:14px}
.ussd{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin:14px 0;font-weight:800;letter-spacing:.06em;font-size:16px}
.ussd .copy{font-size:12px;font-weight:700;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:9px;letter-spacing:0}
.ussd .copy.copied{background:var(--naira)}
.sim{display:flex;gap:10px;align-items:center;background:var(--amber-soft);color:#7C4A03;border-radius:14px;padding:10px 12px;font-size:12px;font-weight:600;margin-bottom:12px}

/* ---------- Lists / settings ---------- */
.card{background:var(--panel-2);border-radius:20px;padding:4px 16px;margin-top:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:opacity .2s}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#fff;color:var(--brand-2);flex-shrink:0}
.item .ic svg{width:20px;height:20px}
.item .tx-t{flex:1;min-width:0}.item .tx-t b{display:block;font-size:15px;font-weight:700}.item .tx-t span{font-size:12px;color:var(--ink-3);display:block;margin-top:2px;line-height:1.35}
.item .chev{color:var(--ink-3)}
.item.danger .ic{background:var(--red-soft);color:var(--red)}.item.danger b{color:var(--red)}
.item.disabled{opacity:.45;pointer-events:none}
.switch{width:50px;height:30px;border-radius:30px;background:#D9D5E6;position:relative;flex-shrink:0;transition:background .25s;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .28s cubic-bezier(.2,1.5,.4,1),width .2s}
.switch:active::after{width:30px}
.switch.on{background:var(--brand-2)}.switch.on::after{transform:translateX(20px)}
.switch.on:active::after{transform:translateX(14px)}
.profile-head{text-align:center;padding:10px 0 6px}
.profile-head .avatar{width:84px;height:84px;font-size:30px;margin:0 auto;background:var(--brand-soft);color:var(--brand);position:relative}
.profile-head .avatar .edit{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--brand-2);color:#fff;display:grid;place-items:center;border:3px solid #fff}
.profile-head h2{font-size:22px;margin-top:12px}
.tier{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#3B1D8F,#6D28D9);color:#fff;border-radius:20px;padding:14px 16px;margin-top:16px}
.tier .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.25);margin-top:8px;overflow:hidden}
.tier .bar i{display:block;height:100%;width:0;background:#fff;border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tier b{font-size:14px}.tier span{font-size:12px;opacity:.85}
.tier .go{background:#fff;color:var(--brand);font-size:12px;font-weight:800;padding:8px 12px;border-radius:10px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-2)}.kv b{font-weight:700;text-align:right;max-width:60%;overflow-wrap:anywhere}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.filters button{padding:8px 14px;border-radius:12px;background:var(--panel-2);font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;transition:all .15s}
.filters button.on{background:var(--ink);color:#fff}
.search{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:14px;height:48px;padding:0 14px}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:15px;font-weight:500}
.search svg{width:18px;height:18px;color:var(--ink-3)}
.faq{background:var(--panel-2);border-radius:16px;margin-top:10px;overflow:hidden}
.faq button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:700;font-size:14px;text-align:left}
.faq button svg{width:18px;height:18px;transition:transform .25s}
.faq .a{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 16px;font-size:13px;color:var(--ink-2);line-height:1.5}
.faq.open .a{max-height:160px;padding-bottom:14px}.faq.open button svg{transform:rotate(180deg)}
.cardpreview{border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#1A1433,#3B1D8F 60%,#6D28D9);height:180px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:background .4s}
.cardpreview.visa{background:linear-gradient(135deg,#1A1F71,#2B45B5)}
.cardpreview.master{background:linear-gradient(135deg,#1A1433,#C2410C 60%,#EA580C)}
.cardpreview.verve{background:linear-gradient(135deg,#0B3D2E,#0E9F6E)}
.cardpreview .num{font-size:20px;font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.cardpreview .brand{position:absolute;top:18px;right:20px;font-weight:800;font-style:italic;font-size:18px;opacity:.95}
.cardpreview .chipx{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#F5D06F,#C9A03E)}
.cardpreview .bot{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.cardpreview .bot b{display:block;font-size:14px;font-weight:700;letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.welcome{flex:1;display:flex;flex-direction:column;background:linear-gradient(160deg,#2A1470 0%,#3B1D8F 50%,#5B2BC7 100%);color:#fff;padding:90px 26px 40px;position:relative;overflow:hidden}
.welcome .logo{width:76px;height:76px;border-radius:24px;background:#fff;display:grid;place-items:center;font-weight:800;color:var(--brand);font-size:30px;letter-spacing:-.05em;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.welcome h2{font-size:34px;margin-top:40px;line-height:1.1}
.welcome p{margin-top:14px;font-size:15px;opacity:.85;line-height:1.55;max-width:300px}
.welcome .naira-bg{position:absolute;right:-40px;bottom:120px;font-size:340px;font-weight:800;opacity:.06;line-height:1;pointer-events:none}
.welcome .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.welcome .pills span{font-size:12px;font-weight:700;background:rgba(255,255,255,.14);padding:6px 10px;border-radius:10px}
.welcome .foot{margin-top:auto}
.welcome .btn.white{background:#fff;color:var(--brand)}

/* ---------- Audit panel ---------- */
.audit h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.audit .lead{color:#B8B1D6;font-size:13px;line-height:1.55;margin-top:8px}
.audit .score{display:flex;gap:10px;margin:22px 0}
.audit .score div{flex:1;background:#241C45;border-radius:16px;padding:14px}
.audit .score b{font-size:26px;font-weight:800;display:block;letter-spacing:-.02em}
.audit .score span{font-size:11px;color:#B8B1D6}
.audit .score .after b{color:#6EE7B7}.audit .score .before b{color:#FCA5A5}
.audit h4{font-size:12px;font-weight:700;color:#8F86B8;margin:26px 0 10px;letter-spacing:.02em}
.heur{background:#241C45;border-radius:16px;margin-bottom:8px;overflow:hidden}
.heur .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left}
.heur .n{width:26px;height:26px;border-radius:8px;background:#3B1D8F;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.heur .hd b{flex:1;font-size:13px;font-weight:700}
.sev{font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px}
.sev.hi{background:#7F1D1D;color:#FECACA}.sev.md{background:#78350F;color:#FDE68A}.sev.lo{background:#14532D;color:#BBF7D0}
.heur .body{display:none;padding:0 14px 14px;font-size:12.5px;line-height:1.55;color:#CFC9E6}
.heur.open .body{display:block}
.heur .body p{margin-bottom:8px}
.heur .body p b{color:#fff}
.heur .body .fix{color:#6EE7B7}
.heur .go{margin-top:6px;background:#3B1D8F;color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:10px}
.audit .ctrl{background:#241C45;border-radius:16px;padding:14px;margin-top:8px}
.audit .ctrl label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;padding:8px 0}
.audit .ctrl .switch{background:#3a3352}
.audit .ctrl .switch.on{background:var(--brand-2)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flow button{background:#3a3352;color:#EDE9F7;font-size:12px;font-weight:600;padding:7px 10px;border-radius:9px}
.flow button:hover{background:#3B1D8F}
.audit-toggle{display:none;position:fixed;right:16px;bottom:16px;z-index:100;background:#1A1433;color:#fff;font-weight:700;font-size:13px;padding:12px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}

@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .audit{position:fixed;inset:0;z-index:99;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
  .audit.open{transform:none}
  .audit .close{display:inline-flex;position:absolute;top:18px;right:18px;background:#3a3352;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700}
  .audit-toggle{display:block}
  .stage-phone{padding:0}
  .phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
  .phone .notch{display:none}
  .statusbar{padding-top:10px}
}
@media (min-width:901px){.audit .close{display:none}}
</style>

<style id="native-shell">
@media (display-mode: standalone), (display-mode: fullscreen){
  .stage{grid-template-columns:1fr}
  .audit{position:fixed;inset:0;z-index:99;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
  .audit.open{transform:none}
  .audit .close{display:inline-flex;position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;background:#3a3352;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700}
  .audit-toggle{display:block;bottom:calc(16px + env(safe-area-inset-bottom))}
  .stage-phone{padding:0}
  .phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
  .phone .notch{display:none}
  .statusbar{display:none}
  .topbar{padding-top:calc(18px + env(safe-area-inset-top))}
  .hero{padding-top:calc(18px + env(safe-area-inset-top))}
  .welcome{padding-top:calc(40px + env(safe-area-inset-top))}
  .nav{padding-bottom:calc(10px + env(safe-area-inset-bottom));height:auto;min-height:74px}
  .sticky-cta{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .sheet{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
html,body{overscroll-behavior:none}
</style>
</head>

</div>

function sheet(html,cls=''){

  bg.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeSheet(); });

}
function closeSheet(){ const bg=app.querySelector('.sheet-bg:last-of-type'); if(!bg)return;
  bg.classList.add('closing'); setTimeout(()=>bg.remove(),230); }
function ripple(e){ const b=e.currentTarget; const r=b.getBoundingClientRect();
  const d=document.createElement('span'); d.className='ripple';
  const size=Math.max(r.width,r.height); d.style.width=d.style.height=size+'px';
  d.style.left=(e.clientX-r.left-size/2)+'px'; d.style.top=(e.clientY-r.top-size/2)+'px';
  b.appendChild(d); setTimeout(()=>d.remove(),500); }
function bindRipples(){ app.querySelectorAll('.btn.primary,.btn.secondary').forEach(b=>b.addEventListener('pointerdown',ripple)); }

/* ============ QR art ============ */
function qrGrid(seed){ let h=0; for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
  let cells=''; const fin=(r,c)=>((r<7&&c<7)||(r<7&&c>13)||(r>13&&c<7));
  for(let r=0;r<21;r++)for(let c=0;c<21;c++){
    let on;
    if(fin(r,c)){ const rr=r>13?r-14:r, cc=c>13?c-14:c;
      on=(rr===0||rr===6||cc===0||cc===6||(rr>1&&rr<5&&cc>1&&cc<5)); }
    else { h=(h*1103515245+12345)>>>0; on=((h>>16)&1)===1; }
    cells+=`<i class="${on?'':'o'}"></i>`;
  } return cells;
}

V.history=()=>{
  const f=S.filter||'all';
  const list=S.txs.filter(t=>f==='all'||(f==='in'&&t.a>0)||(f==='out'&&t.a<0)||(f==='pend'&&t.st!=='ok'));
  const groups={};
  list.forEach((t,i)=>{const d=t.d.split(',')[0];(groups[d]=groups[d]||[]).push([t,S.txs.indexOf(t)])});
  const spent=S.txs.filter(t=>t.a<0&&t.st==='ok').reduce((s,t)=>s+Math.abs(t.a),0);
  return `<div class="screen"><div class="scroll has-nav">

    <button class="item"><div class="ic">${I.phone}</div><div class="tx-t"><b>Call 0700 SMARTPAY</b><span>Free from any Nigerian line, 24/7</span></div><span class="chev">${I.chev}</span></button>
  </div>
</div></div>`;

/* ============ Render ============ */
function render(isBack){
  const v=V[S.screen]||V.home;
  app.querySelectorAll('.sheet-bg').forEach(e=>e.remove());
  app.innerHTML=v();
  if(isBack) app.querySelector('.screen').classList.add('back');
  statusbar(S.screen==='scan'||S.screen==='welcome'||S.screen==='home'||S.screen==='success');
  bindRipples(); wire();
  if(S.screen==='home') setTimeout(()=>{},0);
  if(S.screen==='account') setTimeout(()=>{const b=document.getElementById('tierbar'); if(b)b.style.width='55%'},60);
  if(S.screen==='processing') runProcessing();
  if(S.screen==='success') burst();
  markAuditActive();
}

/* ============ Interaction wiring ============ */

  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{haptic();go(b.dataset.go)});
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{haptic();S.stack=[];S.screen=b.dataset.tab;render()});
  app.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>{S.txIdx=+b.dataset.tx;go('txdetail')});
  app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.toggle; S.toggles[k]=!S.toggles[k]; b.classList.toggle('on',S.toggles[k]);

  if(ph){ ph.focus();
    ph.oninput=()=>{ ph.value=ph.value.replace(/\D/g,'').slice(0,11); S.phone=ph.value;
      const c=carrierOf(S.phone); const f=document.getElementById('phf');
      let tag=f.querySelector('.carrier');
      if(c){ if(!tag){tag=document.createElement('span');f.appendChild(tag);} tag.className='carrier '+c[1]; tag.textContent=c[0]; }

      f.classList.toggle('error',bad); f.classList.toggle('ok',S.phone.length===11&&!!c);
      h.className='help '+(bad?'error':S.phone.length===11?'ok':'');
      h.textContent= bad?'Nigerian numbers start with 0':S.phone.length===11?(c?c[0]+' number recognised':'Looks good'):S.phone.length?`${11-S.phone.length} digits to go`:'Nigerian numbers only, starting 0';
      document.getElementById('cont').disabled=!(S.phone.length===11&&!bad);
    };
    document.getElementById('cont').onclick=()=>{haptic(20);S.otp='';go('otp')};
  }
  // otp
  const otpin=document.getElementById('otpin');
  if(otpin){ otpin.focus();
    otpin.oninput=()=>{ otpin.value=otpin.value.replace(/\D/g,'').slice(0,6); S.otp=otpin.value; drawOtp(); };
    document.getElementById('paste').onclick=()=>{ S.otp='481920'; otpin.value=S.otp; drawOtp(); };
    document.getElementById('verify').onclick=()=>finishOtp();
    document.getElementById('resend').onclick=()=>toast('New code sent','ok');
    setTimeout(()=>{ if(S.screen==='otp'&&S.otp.length===0){ S.otp='481920'; otpin.value=S.otp; drawOtp(); toast('Code read from SMS automatically','ok'); } },2600);
  }
  function drawOtp(){ const boxes=[...app.querySelectorAll('#otp .box')];
    boxes.forEach((b,i)=>{ const had=b.textContent; b.textContent=S.otp[i]||'';
      b.classList.toggle('active',i===S.otp.length); if(!had&&b.textContent){b.classList.remove('filled');void b.offsetWidth;b.classList.add('filled');haptic(8);} });
    document.getElementById('verify').disabled=S.otp.length!==6;
    if(S.otp.length===6) setTimeout(finishOtp,350);
  }
  function finishOtp(){ if(S.otp.length!==6)return;
    app.querySelectorAll('#otp .box').forEach(b=>{b.classList.add('done');b.classList.remove('active')});
    haptic(30); setTimeout(()=>{S.stack=[];S.screen='home';render();toast('Welcome to SmartPay','ok')},520);
  }
  // home
  const eye=document.getElementById('eye');
  if(eye) eye.onclick=()=>{S.hideBal=!S.hideBal;haptic();render()};

        const cta=document.createElement('button'); cta.className='btn primary'; cta.style.marginTop='16px'; cta.textContent='Continue';

    } else { r.innerHTML='<span class="small">We check the name before you send — always confirm it.</span>';

  });
  app.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{S.amount=b.dataset.quick;haptic();updateAmount();
    app.querySelectorAll('[data-quick]').forEach(x=>x.classList.toggle('on',x===b))});
  const noteIn=document.getElementById('note'); if(noteIn) noteIn.oninput=()=>S.note=noteIn.value;
  function updateAmount(){
    const v=document.getElementById('amtv'); if(!v)return;

    v.textContent=S.amount?fmt0(S.amount):'0'; v.classList.toggle('zero',!S.amount);

    const tu=document.getElementById('tu'); if(tu)tu.onclick=()=>go('topup');

  const next=document.getElementById('next'); if(next) next.onclick=()=>{haptic(20);go('review')};

  // slide to send
  const sl=document.getElementById('slider');

    const start=e=>{drag=true;max=sl.clientWidth-56;startX=(e.touches?e.touches[0].clientX:e.clientX)-knob.offsetLeft;knob.style.transition='none'};
    const move=e=>{ if(!drag)return; const x=(e.touches?e.touches[0].clientX:e.clientX)-startX;
      const p=Math.max(4,Math.min(max,x)); knob.style.left=p+'px'; fill.style.width=(p+52)+'px';
      track.style.opacity=1-(p/max)*1.2;
      if(p>=max-2){drag=false;done()} };
    const end=()=>{ if(!drag)return; drag=false; knob.style.transition='left .25s'; knob.style.left='4px'; fill.style.width=0; track.style.opacity=1; };
    const done=()=>{ sl.classList.add('done'); track.textContent='Confirming…'; track.style.opacity=1; haptic(30);
      setTimeout(()=>{S.pin='';go('pin')},420); };

  const rep=document.getElementById('repeat'); if(rep) rep.onclick=()=>{const t=S.txs[S.txIdx];
    S.recipient={n:t.t,h:t.s,col:'#6D28D9'};S.amount=String(Math.abs(t.a));S.note='';go('amount')};

  // add card
  const cn=document.getElementById('cn');
  if(cn){ const upd=()=>{
      let v=cn.value.replace(/\D/g,'').slice(0,16); cn.value=v.replace(/(.{4})/g,'$1 ').trim();

      document.getElementById('savecard').disabled=!(v.length===16&&document.getElementById('ce').value.length===5&&document.getElementById('cv').value.length===3);

    cn.oninput=upd;
    const ce=document.getElementById('ce');
    ce.oninput=()=>{let v=ce.value.replace(/\D/g,'').slice(0,4); if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2); ce.value=v;

}

/* ============ Payment engine ============ */
function submitPayment(){
  if(S.network==='offline'){ S.screen='processing'; render(); setTimeout(()=>offlineSheet(),1500); return; }
  S.ussdFlow=false; go('processing');
}
function runProcessing(){
  const el=document.getElementById('stages'); if(!el)return;
  const steps=[...el.children]; let i=0;
  steps[0].classList.add('on');
  S._pt=setInterval(()=>{
    steps[i].classList.remove('on'); steps[i].classList.add('done'); i++;
    if(i<steps.length){ steps[i].classList.add('on'); if(S.network==='poor'&&i===1){} }
    else { clearInterval(S._pt);
      if(S.network==='offline'){ offlineSheet(); return; }
      const a=Number(S.amount); S.balance-=a+(a<5000?0:10);
      S.txs.unshift({t:S.recipient.n,s:S.recipient.h,a:-a,st:'ok',d:'Today, '+new Date().toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'}),ref:'SP-'+Math.random().toString(36).slice(2,8).toUpperCase(),ch:S.ussdFlow?'USSD':'NIP'});
      haptic(40); S.stack=['home']; S.screen='success'; render();
    }
  },900);
  if(S.network==='poor'){ clearInterval(S._pt);
    steps[0].classList.add('done'); steps[0].classList.remove('on'); steps[1].classList.add('on');
    setTimeout(()=>{ if(S.screen==='processing') offlineSheet(); },2500); }
}
function offlineSheet(){
  const bank=S.bank||BANKS[1], a=S.amount, acct=(S.recipient.h.match(/\d[\d ]{4,}/)||['0123456789'])[0].replace(/ /g,'');
  const code=`${bank.ussd.replace('#','')}*50*${a}*${acct}#`;
  const bg=sheet(`<div class="network-sheet">
    <div class="icon">${I.wifi}</div>
    <h3>Data dropped — finish over USSD</h3>
    <p class="sub">Your transfer is saved. Dial this code and the money moves on the GSM network instead. Nothing was charged yet.</p>
    <div class="sim">${I.warn}<span>Dial with SIM 1 (MTN) — the line linked to your ${bank.n} account.</span></div>
    <div class="ussd"><span class="fnum">${code}</span><button class="copy" id="cpy">Copy</button></div>
    <div class="review" style="margin-top:0">
      <div class="r"><span>To</span><b>${S.recipient.n}</b></div>
      <div class="r"><span>Amount</span><b class="fnum">₦${fmt(a)}</b></div>
      <div class="r"><span>Bank</span><b>${bank.n}</b></div>
    </div>
    <button class="btn primary" style="margin-top:16px" id="dial">Open dialer</button>
    <button class="btn ghost" id="waitnet">Wait for data instead</button>
  </div>`,'network-sheet-bg');
  bg.querySelector('#cpy').onclick=e=>{const b=e.currentTarget;b.classList.add('copied');b.textContent='Copied';haptic(20);
    setTimeout(()=>{b.classList.remove('copied');b.textContent='Copy'},1600)};
  bg.querySelector('#waitnet').onclick=()=>{closeSheet();setTimeout(()=>{S.screen='review';render(true)},250)};
  bg.querySelector('#dial').onclick=()=>{
    closeSheet(); haptic(20);
    toast('Opening dialer — confirm with your bank PIN','warn',2600);
    setTimeout(()=>{
      const a2=Number(S.amount); S.balance-=a2; S.ussdFlow=true;
      S.txs.unshift({t:S.recipient.n,s:S.recipient.h+' · USSD',a:-a2,st:'ok',d:'Today, '+new Date().toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'}),ref:'SP-'+Math.random().toString(36).slice(2,8).toUpperCase(),ch:'USSD'});
      S.network='good'; S.stack=['home']; S.screen='success'; render();
      setTimeout(()=>toast('Debit alert matched — transfer confirmed','ok',2600),900);
    },2400);
  };
}
function burst(){ const c=document.getElementById('conf'); if(!c)return;
  const cols=['#fff','#FDE68A','#6EE7B7','#C4B5FD','#FCA5A5'];
  for(let i=0;i<26;i++){ const s=document.createElement('i');
    const ang=Math.random()*Math.PI*2, dist=90+Math.random()*180;
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px'); s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.setProperty('--r',Math.random()*720+'deg'); s.style.background=cols[i%cols.length];
    s.style.animationDelay=(Math.random()*.2)+'s'; c.appendChild(s); }
  setTimeout(()=>c.innerHTML='',1400);
}
